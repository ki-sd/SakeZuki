services:
  # 개발·배포 컨테이너가 같은 네트워크에서 서비스 이름으로 서로 연결된다.
  mysql:
    image: mysql:8.4
    container_name: sakezuki-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      # DB 파일은 컨테이너 재생성 후에도 유지
      - sakezuki-mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: sakezuki-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306

    depends_on:
      # 애플리케이션이 DB 시작 도중 연결을 시도하지 않도록 건강 상태를 기다린다.
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    container_name: sakezuki-frontend
    restart: unless-stopped

    depends_on:
      - backend

  nginx:
    # 외부 HTTP 진입점은 Nginx 하나로 두고 /api와 화면 요청을 내부 서비스로 나눈다.
    image: nginx:alpine
    container_name: sakezuki-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend

volumes:
  sakezuki-mysql-data: