services:
  mysql:
    image: mysql:8.4
    container_name: sakezuki-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: sakezuki
      MYSQL_USER: sakezuki
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - sakezuki-mysql-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sakezuki-mysql-data: