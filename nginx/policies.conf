# OAuth code·state, 쿠키, 이메일, IP를 접근 로그에 남기지 않는다.
log_format safe '$request_method $uri $status $request_time';
access_log /var/log/nginx/access.log safe;
# 기본 오류 로그는 원문 요청 URI를 붙이므로 일반 진단은 위 상태 코드 로그로 제한한다.
error_log /var/log/nginx/error.log crit;
limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=recommend:10m rate=6r/m;
limit_conn_zone $server_name zone=ai_connections:1m;
limit_req_status 429;
limit_conn_status 429;
limit_req_zone $binary_remote_addr zone=ugc_upload:10m rate=12r/m;
