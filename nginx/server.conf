client_max_body_size 16k;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 30s;
server_tokens off;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
# 위조된 프록시 헤더를 이어 붙이지 않고 이 진입점에서 새로 만든다.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
proxy_connect_timeout 10s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
location = /api/auth/login {
    limit_req zone=login burst=10 nodelay;
    proxy_pass http://backend:8080;
}
location /api/auth/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://backend:8080;
}
location /api/recommend/ {
    limit_req zone=recommend burst=5 nodelay;
    limit_conn ai_connections 8;
    proxy_pass http://backend:8080;
}
location /api/user/verification/ {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend:8080;
}
location = /api/user/sake-submissions/uploads {
    limit_except POST { deny all; }
    client_max_body_size 11m;
    limit_req zone=ugc_upload burst=4 nodelay;
    proxy_pass http://backend:8080;
}
location /api/ { proxy_pass http://backend:8080; }
location ~ ^/(oauth2/|login/oauth2/) {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://backend:8080;
}
location / { proxy_pass http://frontend:3000; }
