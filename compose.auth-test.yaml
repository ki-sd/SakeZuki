# Isolated integration database. Never mounts the application's MySQL volume.
services:
  mysql-auth-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sakezuki_auth_it
      MYSQL_USER: auth_it
      MYSQL_PASSWORD: ${AUTH_TEST_DB_PASSWORD:?Set an ephemeral test password}
      MYSQL_ROOT_PASSWORD: ${AUTH_TEST_DB_PASSWORD:?Set an ephemeral test password}
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 45
