name: 서비스 검증
on:
  push:
    branches: [feat/public-examples-history-ux]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트 의존성과 Chromium 준비
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 프론트 단위·타입·린트·빌드
        working-directory: frontend
        run: |
          npm run test:auth
          npx tsc --noEmit
          npm run lint
          npm run build
      - name: 분리 MySQL·전체 백엔드·Chromium 검증
        run: python3 scripts/test_auth_integration.py --e2e
      - name: Linux Docker 이미지 빌드와 기동
        run: python3 scripts/test_public_containers.py
      - name: 실패한 테스트의 안전한 보고서 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/build/reports/tests
            frontend/test-results
          retention-days: 3
