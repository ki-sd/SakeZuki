plugins {
    id 'java'
}

group = 'com.kisd'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.sakezuki:image-core:1.0-SNAPSHOT'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.mysql:mysql-connector-j:26.7.0'
    implementation 'com.google.genai:google-genai:1.72.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    dependsOn gradle.includedBuild('image-core').task(':verifyTestReports')
    useJUnitPlatform { excludeTags 'mysql-integration' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8'
    defaultCharacterEncoding = 'UTF-8'
}

tasks.register('productMappingDryRun', JavaExec) {
    group = 'verification'
    description = 'Reviews local product mapping evidence and prints a JSON report without writes.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.sakezuki.tools.mapping.ProductMappingDryRun'
}

tasks.register('r2DevSmoke', JavaExec) {
    group = 'verification'
    description = 'Opt-in smoke test against the sakezuki-images-dev R2 bucket.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sakezuki.tools.images.R2DevSmoke'
    doFirst {
        if (System.getenv('R2_SMOKE_CONFIRM') != 'sakezuki-images-dev' ||
                System.getenv('R2_BUCKET') != 'sakezuki-images-dev') {
            throw new GradleException('R2 smoke requires explicit confirmation for sakezuki-images-dev.')
        }
    }
}

tasks.register('catalogIntegrationTest', Test) {
    group = 'verification'
    description = 'Tests catalog repositories on the isolated migrated MySQL database.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'mysql-integration' }
    outputs.upToDateWhen { false }
    doFirst {
        if (!(System.getenv('AUTH_TEST_JDBC_URL') ==~ /jdbc:mysql:\/\/(localhost|127\.0\.0\.1):3308\/sakezuki_auth_it(\?.*)?/) ||
                !System.getenv('AUTH_TEST_DB_PASSWORD')) {
            throw new GradleException('Use scripts/test_auth_integration.py with its isolated MySQL database.')
        }
    }
}
